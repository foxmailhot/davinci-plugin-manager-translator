name: Build and release
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['resolve_manager/version.py']
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --target .tools/packaging pyinstaller==6.22.3
          python -m pip install --target .tools ziglang==0.13.0
      - name: Build
        shell: pwsh
        run: ./build-resolve-manager.ps1
      - name: Test
        shell: pwsh
        run: python -m unittest discover -s resolve_manager -p 'test_*.py' -v
      - name: Package
        shell: pwsh
        run: python resolve_manager/release_package.py 'dist/达芬奇插件管理与翻译软件' release
      - uses: actions/upload-artifact@v4
        with:
          name: ResolvePluginManager-windows-x64
          path: release/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'resolve_manager'); from version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $releaseTag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $releaseTag) { throw 'Tag/version mismatch' }
          gh release view $releaseTag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $releaseTag release/* --clobber
          } else {
            gh release create $releaseTag release/* --target $env:GITHUB_SHA --title "达芬奇插件管理与翻译软件 $releaseTag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
